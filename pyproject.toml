[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trackdeck"
version = "0.1.0"
description = "Multitrack Session Ingestion & Lossless Stem Bus Middleware for StemDeck"
readme = "README.md"
authors = [{ name = "TrackDeck" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "soundfile>=0.12.0",
    "scipy>=1.10.0",
]

[project.scripts]
trackdeck = "track_deck.cli:main"
track-deck = "track_deck.cli:main"
